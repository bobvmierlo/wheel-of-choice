# Run the test suite when a pull request is opened.
#
# Deliberately *only* on opening a PR — not on later pushes, merges or
# other events — to keep Actions minutes down. To re-run on an open PR,
# use "Re-run jobs" on the check, or run it by hand from the Actions tab
# (workflow_dispatch).
name: Tests

on:
  pull_request:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest -q
